<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container mt-5">
    <h1 class="text-center mb-4">Employee Form</h1>
    <form id="employee-form" th:action="@{/saveEmployee}" th:object="${employee}" method="post">
        <input type="hidden" th:field="*{id}">
        <div class="mb-3"><label for="employee-first-name">First Name</label><input id="employee-first-name" type="text" class="form-control" th:field="*{firstName}" required><div class="text-danger" th:errors="*{firstName}"></div></div>
        <div class="mb-3"><label for="employee-last-name">Last Name</label><input id="employee-last-name" type="text" class="form-control" th:field="*{lastName}" required><div class="text-danger" th:errors="*{lastName}"></div></div>
        <div class="mb-3"><label for="employee-email">Email</label><input id="employee-email" type="email" class="form-control" th:field="*{email}" required><div class="text-danger" th:errors="*{email}"></div></div>
        <div class="mb-3"><label for="employee-position">Position</label><input id="employee-position" type="text" class="form-control" th:field="*{position}" required><div class="text-danger" th:errors="*{position}"></div></div>
        <button id="save-employee-button" type="submit" class="btn btn-primary">Save</button>
        <a th:href="@{/employees}" class="btn btn-secondary">Cancel</a>
    </form>
</main>
</body>
</html>
