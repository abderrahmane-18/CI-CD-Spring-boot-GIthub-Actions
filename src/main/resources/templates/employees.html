<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container mt-5">
    <h1 class="text-center mb-4">Employee Management System</h1>
    <a id="add-employee-button" th:href="@{/showNewEmployeeForm}" class="btn btn-success mb-3">Add Employee</a>
    <table id="employee-table" class="table table-bordered table-striped">
        <thead class="table-dark"><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Email</th><th>Position</th><th>Actions</th></tr></thead>
        <tbody>
        <tr th:each="employee : ${listEmployees}" data-testid="employee-row"
            th:attr="data-employee-email=${employee.email}">
            <td th:text="${employee.id}"></td><td th:text="${employee.firstName}"></td><td th:text="${employee.lastName}"></td><td th:text="${employee.email}"></td><td th:text="${employee.position}"></td>
            <td class="d-flex gap-2">
                <a th:href="@{/showFormForUpdate/{id}(id=${employee.id})}" class="btn btn-warning btn-sm">Edit</a>
                <form th:action="@{/deleteEmployee/{id}(id=${employee.id})}" method="post"><button type="submit" class="btn btn-danger btn-sm" data-testid="delete-employee">Delete</button></form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
